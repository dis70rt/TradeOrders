services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-trade
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - trade-orders
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    env_file:
      - .env
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - trade-orders
    volumes:
      - redisdata:/data

  zookeeper:
    image: zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"
    networks:
      - trade-orders
  
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    networks:
      - trade-orders
    volumes:
      - kafka:/var/lib/kafka/data

  api:
    build: .
    container_name: api-service
    restart: unless-stopped
    command: ["./api"]
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - KAFKA_BROKER=kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - trade-orders

  matching:
    build: .
    container_name: matching-service
    restart: unless-stopped
    command: ["./matching"]
    env_file:
      - .env
    environment:
      - KAFKA_BROKER=kafka:9092
    depends_on:
      - kafka
    networks:
      - trade-orders

  database:
    build: .
    container_name: database-service
    restart: unless-stopped
    command: ["./database"]
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - KAFKA_BROKER=kafka:9092
    depends_on:
      - postgres
      - kafka
    networks:
      - trade-orders

  stream:
    build: .
    container_name: stream-service
    restart: unless-stopped
    command: ["./stream"]
    env_file:
      - .env
    environment:
      - KAFKA_BROKER=kafka:9092
    ports:
      - "8081:8081"
    depends_on:
      - kafka
    networks:
      - trade-orders

networks:
  trade-orders:
    driver: bridge
  
volumes:
  pgdata:
  redisdata:
  kafka: